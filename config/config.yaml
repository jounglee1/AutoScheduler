days_past: 14
days_ahead: 14
default_duration_minutes: 300
valid_hour_start: 6
valid_hour_end: 24

db:
  path: data/local.db

gcal:
  calendar_id: primary
  timezone: Canada/Pacific

extractor:
  model: gpt-5-nano-2025-08-07

categories:
