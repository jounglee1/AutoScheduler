    preferred_time:
      - [9, 17]
  meal:
    preferred_time:
      - [12, 13]
      - [18, 20]
  social:
    preferred_time:
      - [10, 11]
      - [14, 17]
  event:
    preferred_time:
      - [18, 22]
  other:
    preferred_time:
      - [9, 22]

predictor:

agent:
  max_slots: 5
