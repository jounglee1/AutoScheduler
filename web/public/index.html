<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoScheduler</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <div>
      <h1>AutoScheduler</h1>
      <p style="margin-top:0.5rem">Connect your Google Calendar to get started</p>
    </div>
    <a class="google-btn" href="http://localhost:8001/auth/login">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Sign in with Google
    </a>
  </div>
</div>

<!-- App Screen -->
<div id="app-screen">
  <header>
    <div>
      <h1>AutoScheduler</h1>
      <p>AI-powered scheduling assistant</p>
    </div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </header>

  <div class="container">

    <!-- Calendar -->
    <div class="card">
      <div class="card-header">
        <h2>Calendar</h2>
        <div style="display:flex;align-items:center;gap:0.75rem">
          <div class="cal-toggles">
            <button class="cal-toggle active" id="toggle-confirmed" onclick="toggleFilter('confirmed')">Confirmed</button>
            <button class="cal-toggle active" id="toggle-predicted" onclick="toggleFilter('predicted')">Predicted</button>
            <button class="cal-toggle active" id="toggle-tentative" onclick="toggleFilter('tentative')">Tentative</button>
          </div>
          <button class="btn btn-primary" id="sync-btn" onclick="syncCal()" style="padding:0.4rem 1rem;font-size:0.8rem" title="Sync from Google Calendar">Sync</button>          <div class="cal-nav">
            <button onclick="changeMonth(-1)">&#8249;</button>
            <span id="cal-title"></span>
            <button onclick="changeMonth(1)">&#8250;</button>
          </div>
        </div>
      </div>
      <div class="cal-grid" id="cal-dow"></div>
      <div class="cal-grid" id="cal-grid" style="margin-top:2px"></div>
      <div class="cal-legend" style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;gap:1rem">
          <span><i style="background:#2563eb"></i> Confirmed</span>
          <span><i style="background:#7c3aed"></i> Predicted</span>
          <span><i style="background:#f59e0b"></i> Tentative</span>
        </div>
        <div style="display:flex;gap:0.25rem">
          <button class="btn" id="clear-predicted-btn" onclick="clearPredicted()" style="padding:0.3rem 0.85rem;font-size:0.8rem;background:#f1f5f9;color:#7c3aed" title="Clear all predicted schedules">Clear Predicted</button>
          <button class="btn" id="clear-tentative-btn" onclick="clearTentative()" style="padding:0.3rem 0.85rem;font-size:0.8rem;background:#f1f5f9;color:#b45309" title="Clear all tentative schedules">Clear Tentative</button>
        </div>
      </div>
    </div>

    <!-- Scheduler -->
    <div class="card">
      <h2 style="margin-bottom:1rem">New Schedule Request</h2>
      <textarea id="conversation"
        placeholder="Describe your schedule — e.g. 'Team meeting next Monday at 2pm for an hour, and client call on Wednesday at 10.'">
      </textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="run-btn" onclick="runScheduler()">Analyze Schedule</button>
      </div>
    </div>

    <div id="status-msg" style="display:none"></div>
    <div id="results"></div>

    <!-- Settings -->
    <div class="card" id="settings-card">
      <div class="card-header" style="cursor:pointer" onclick="toggleSettings()">
        <h2>Settings</h2>
        <span id="settings-chevron" style="font-size:1.1rem;color:#94a3b8">&#8250;</span>
      </div>
      <div id="settings-body" style="display:none;margin-top:1rem">
        <div class="settings-grid">
          <label>Timezone</label>
          <select id="cfg-timezone">
            <optgroup label="Americas">
              <option value="America/New_York">New York (ET)</option>
              <option value="America/Chicago">Chicago (CT)</option>
              <option value="America/Denver">Denver (MT)</option>
              <option value="America/Los_Angeles">Los Angeles (PT)</option>
              <option value="America/Vancouver">Vancouver (PT)</option>
              <option value="America/Toronto">Toronto (ET)</option>
              <option value="America/Sao_Paulo">São Paulo (BRT)</option>
            </optgroup>
            <optgroup label="Europe">
              <option value="Europe/London">London (GMT/BST)</option>
              <option value="Europe/Paris">Paris (CET)</option>
              <option value="Europe/Berlin">Berlin (CET)</option>
              <option value="Europe/Moscow">Moscow (MSK)</option>
            </optgroup>
            <optgroup label="Asia / Pacific">
              <option value="Asia/Dubai">Dubai (GST)</option>
              <option value="Asia/Kolkata">Mumbai/Delhi (IST)</option>
              <option value="Asia/Bangkok">Bangkok (ICT)</option>
              <option value="Asia/Singapore">Singapore (SGT)</option>
              <option value="Asia/Shanghai">Shanghai/Beijing (CST)</option>
              <option value="Asia/Tokyo">Tokyo (JST)</option>
              <option value="Asia/Seoul">Seoul (KST)</option>
              <option value="Australia/Sydney">Sydney (AEST)</option>
            </optgroup>
            <optgroup label="Other">
              <option value="UTC">UTC</option>
            </optgroup>
          </select>
          <label>Prediction Range (days)</label>
          <input type="number" id="cfg-days_ahead" min="0" />
          <label>Max Slots to Schedule</label>
          <input type="number" id="cfg-max_slots" min="1" />
          <label>Default Duration</label>
          <div class="dur-inputs">
            <input type="number" id="cfg-dur-h" min="0" placeholder="0" />
            <span class="dur-unit">h</span>
            <input type="number" id="cfg-dur-m" min="0" max="59" placeholder="0" />
            <span class="dur-unit">m</span>
          </div>
        </div>

        <h3 style="margin-top:1.25rem;margin-bottom:0.5rem;font-size:0.88rem;color:#475569">Active Hours</h3>
        <div class="hour-blocks" id="cfg-active-hours"></div>

        <h3 style="margin-top:1.25rem;margin-bottom:0.5rem;font-size:0.88rem;color:#475569">Category Hours</h3>
        <table class="settings-timetable" id="cfg-categories-table">
          <thead>
            <tr><th>Category</th><th>Active Hours (click to toggle)</th></tr>
          </thead>
          <tbody id="cfg-categories-body"></tbody>
        </table>

        <div class="btn-row" style="margin-top:1.25rem;gap:0.5rem">
          <button class="btn" style="background:#f1f5f9;color:#475569" onclick="cancelSettings()">Cancel</button>
          <button class="btn btn-primary" onclick="saveSettings()">Save</button>
        </div>
        <div id="settings-msg" style="display:none;margin-top:0.5rem;font-size:0.82rem"></div>
      </div>
    </div>
  </div>
</div>

<!-- Day Detail Modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/calendar.js"></script>
<script src="js/app.js"></script>

</body>
</html>
